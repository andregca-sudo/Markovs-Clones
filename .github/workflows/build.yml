name: Build Markovs Clones

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      - name: Build mod
        run: chmod +x gradlew && ./gradlew build

      - name: Upload mod
        uses: actions/upload-artifact@v7
        with:
          name: Markovs-Clones
          path: build/libs/*.jar
